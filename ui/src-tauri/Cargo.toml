[package]
name = "ultra-gaming-mode"
version = "3.0.0"
description = "Ultra Gaming Mode v3.0 Native Desktop Application"
authors = ["Ultra Gaming Mode Team"]
edition = "2021"

[lib]
name = "ultra_gaming_mode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.8"
