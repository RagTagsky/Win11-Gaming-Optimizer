[package]
name = "ultra-gaming-mode"
version = "3.1.1"
description = "Ultra Gaming Mode v3.1.1 Native Desktop Application"
authors = ["Ultra Gaming Mode Team"]
edition = "2021"
build = "build.rs"

[[bin]]
name = "UltraGamingMode"
path = "src/main.rs"
test = false

[lib]
name = "ultra_gaming_mode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
