<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('ugm-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.backgroundColor =
          theme === 'light' ? '#f4f6fa' : '#0c0e12';
        document.documentElement.style.color =
          theme === 'light' ? '#0f172a' : '#f1f5f9';
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) {
          meta.setAttribute('content', theme);
        }

        function showBootError(detail) {
          var host = document.getElementById('app');
          if (!host || host.children.length > 0) return;
          host.innerHTML =
            '<div style="padding:24px;font-family:\'Segoe UI\',sans-serif;max-width:680px;margin:40px auto;border-radius:12px;border:1px solid #f87171;background:#13161c;color:#f1f5f9">' +
            '<h2 style="margin:0 0 8px 0;font-size:16px;color:#f87171">Ошибка запуска интерфейса</h2>' +
            '<p style="margin:0 0 12px 0;font-size:13px;line-height:1.5;color:#cbd5e1;word-break:break-word"></p>' +
            '<button type="button" onclick="location.reload()" style="padding:8px 14px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:13px;cursor:pointer">Перезагрузить</button>' +
            '</div>';
          var p = host.querySelector('p');
          if (p) p.textContent = String(detail || 'Неизвестный сбой инициализации');
        }

        window.addEventListener('error', function (ev) {
          showBootError(ev && (ev.message || (ev.error && ev.error.message)));
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev && ev.reason;
          showBootError(reason && reason.message ? reason.message : reason);
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель управления · Ultra Gaming Mode v3.5.2</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
